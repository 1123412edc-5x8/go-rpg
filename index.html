<!-- 右側功能選單按鈕 -->
<div id="side-menu-tabs">
  <button onclick="togglePanel('inventory-panel')">🎒 背包</button>
  <button onclick="togglePanel('market-panel')">⚖️ 交易所</button>
</div>

<!-- 浮動面板：背包 & 裝備上架 -->
<div id="inventory-panel" class="game-panel hidden">
  <div class="panel-header">
    <h3>🎒 玩家背包</h3>
    <button class="close-btn" onclick="togglePanel('inventory-panel')">✕</button>
  </div>
  <p id="player-gold-display">💰 當前金幣: 0</p>
  <hr style="border-color: #444; margin: 8px 0;">
  <h4>道具列表 (點擊可選擇上架)</h4>
  <div id="inventory-list" class="item-grid"></div>
  
  <!-- 上架控制區 -->
  <div id="sell-box" class="sell-box hidden">
    <p>準備上架: <strong id="sell-item-name">--</strong></p>
    <input type="number" id="sell-price-input" placeholder="請設定售價 (金幣)" min="1">
    <button id="confirm-sell-btn" class="action-btn-sm green">確認上架拍賣行</button>
  </div>
</div>

<!-- 浮動面板：拍賣行 / 交易所 -->
<div id="market-panel" class="game-panel hidden">
  <div class="panel-header">
    <h3>⚖️ 全服拍賣行</h3>
    <button class="close-btn" onclick="togglePanel('market-panel')">✕</button>
  </div>
  <div id="market-list" class="market-list"></div>
</div>
