<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Milky Way Idle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 登入 Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="mwi-logo">🌌 Milky Way Idle</div>
      <p class="sub-text">請輸入角色暱稱開始遊戲</p>
      
      <form id="auth-form">
        <input type="text" id="nickname-input" placeholder="角色暱稱 (例如: goosewwwww)" class="input-field" value="goosewwwww" required>
        <button type="submit" class="btn btn-primary full-btn">進入遊戲</button>
      </form>
    </div>
  </div>

  <!-- 遊戲主要佈局 -->
  <div class="mwi-app">

    <!-- 1. 左側導覽列 -->
    <aside id="sidebar" class="mwi-sidebar">
      <div class="sidebar-header">
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
      </div>

      <div class="sidebar-menu">
        <div class="nav-item" onclick="switchMainTab('tab-inventory')">
          <span class="nav-icon">📦</span><span class="nav-text">我的物品</span>
        </div>
        <div class="nav-item" onclick="switchMainTab('tab-market')">
          <span class="nav-icon">🏪</span><span class="nav-text">市場</span>
        </div>
        
        <div class="menu-divider"></div>

        <div class="nav-item active" onclick="openSkillPage('milking')">
          <span class="nav-icon">🥛</span>
          <div class="skill-info-wrap">
            <div class="skill-name-row"><span>擠奶</span><span class="sk-lv" id="sk-lv-milking">1</span></div>
            <div class="mini-progress"><div id="sk-bar-milking" class="mini-fill"></div></div>
          </div>
        </div>

        <div class="nav-item" onclick="openSkillPage('foraging')">
          <span class="nav-icon">🍄</span>
          <div class="skill-info-wrap">
            <div class="skill-name-row"><span>採摘</span><span class="sk-lv" id="sk-lv-foraging">1</span></div>
            <div class="mini-progress"><div id="sk-bar-foraging" class="mini-fill"></div></div>
          </div>
        </div>

        <div class="nav-item" onclick="openSkillPage('woodcutting')">
          <span class="nav-icon">🌲</span>
          <div class="skill-info-wrap">
            <div class="skill-name-row"><span>伐木</span><span class="sk-lv" id="sk-lv-woodcutting">1</span></div>
            <div class="mini-progress"><div id="sk-bar-woodcutting" class="mini-fill"></div></div>
          </div>
        </div>

        <div class="nav-item" onclick="openSkillPage('cheesesmithing')">
          <span class="nav-icon">🧀</span>
          <div class="skill-info-wrap">
            <div class="skill-name-row"><span>乳酪鍛造</span><span class="sk-lv" id="sk-lv-cheesesmithing">1</span></div>
            <div class="mini-progress"><div id="sk-bar-cheesesmithing" class="mini-fill"></div></div>
          </div>
        </div>

        <div class="nav-item" onclick="openSkillPage('cooking')">
          <span class="nav-icon">🍳</span>
          <div class="skill-info-wrap">
            <div class="skill-name-row"><span>烹飪</span><span class="sk-lv" id="sk-lv-cooking">1</span></div>
            <div class="mini-progress"><div id="sk-bar-cooking" class="mini-fill"></div></div>
          </div>
        </div>

        <div class="nav-item" onclick="openSkillPage('combat')">
          <span class="nav-icon">⚔️</span>
          <div class="skill-info-wrap">
            <div class="skill-name-row"><span>戰鬥</span><span class="sk-lv" id="sk-lv-combat">1</span></div>
            <div class="mini-progress"><div id="sk-bar-combat" class="mini-fill"></div></div>
          </div>
        </div>

        <div class="menu-divider"></div>

        <div class="nav-item" onclick="switchMainTab('tab-rank')">
          <span class="nav-icon">🏆</span><span class="nav-text">排行榜</span>
        </div>
        <div class="nav-item" onclick="switchMainTab('tab-settings')">
          <span class="nav-icon">⚙️</span><span class="nav-text">設定</span>
        </div>
      </div>
    </aside>

    <!-- 2. 右側主要顯示區 -->
    <main class="mwi-main">

      <!-- 頂部資訊列 -->
      <header class="mwi-header">
        <div class="user-status-box">
          <div class="user-avatar">👤</div>
          <div class="user-text">
            <div id="username-display" class="uname">goosewwwww</div>
            <div class="utotal">總等級: <span id="total-level-val">6</span></div>
          </div>
        </div>

        <div class="action-bar-container">
          <div class="action-title-row">
            <span id="current-action-text">🥛 擠奶中...</span>
            <span id="action-timer-text">2.00s</span>
          </div>
          <div class="progress-track">
            <div id="action-progress-bar" class="progress-fill"></div>
          </div>
        </div>

        <button class="btn-stop" onclick="stopCurrentAction()">停止</button>
      </header>

      <!-- 主要分頁內容區 -->
      <div class="mwi-body">

        <!-- 頁籤 A: 工作選擇區 -->
        <section id="tab-skill-page" class="main-panel active">
          <h2 id="page-skill-title" class="page-title">擠奶</h2>
          <div id="action-cards-grid" class="cards-grid"></div>
        </section>

        <!-- 頁籤 B: 倉庫 -->
        <section id="tab-inventory" class="main-panel">
          <div class="panel-top">
            <h2 class="page-title">📦 我的物品</h2>
            <div class="gold-disp">💰 金幣: <span id="gold-val">0</span></div>
          </div>
          <div id="inventory-grid" class="inventory-grid"></div>
        </section>

        <!-- 頁籤 C: 市場 -->
        <section id="tab-market" class="main-panel">
          <div class="panel-top">
            <h2 class="page-title">🏪 玩家市場</h2>
            <button class="btn-primary" onclick="sellItemModal()">+ 上架物品</button>
          </div>
          <div id="market-list" class="list-container"></div>
        </section>

        <!-- 頁籤 D: 排行榜 -->
        <section id="tab-rank" class="main-panel">
          <div class="panel-top">
            <h2 class="page-title">🏆 全服排行榜</h2>
            <button class="btn-sec" onclick="loadLeaderboard()">刷新</button>
          </div>
          <div id="rank-list" class="list-container"></div>
        </section>

        <!-- 頁籤 E: 設定 -->
        <section id="tab-settings" class="main-panel">
          <h2 class="page-title">⚙️ 系統設定</h2>
          <div class="settings-card">
            <p>角色名稱：<strong id="settings-name-text">goosewwwww</strong></p>
            <p>存檔狀態：<span style="color:#4ade80;">🟢 本地/雲端自動存檔</span></p>
          </div>
        </section>

      </div>

      <!-- 底部日誌區 -->
      <footer class="mwi-footer">
        <div id="log-box" class="log-box"></div>
      </footer>

    </main>

  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
