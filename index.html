<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>超肝自動掛機 RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 登入/創角 Modal -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <h2>進入掛機世界</h2>
      <button id="google-btn" class="auth-btn google">🌐 使用 Google 帳號登入</button>
      <form id="auth-form">
        <input type="email" id="email-input" placeholder="Email" required>
        <input type="password" id="password-input" placeholder="密碼 (至少6碼)" minlength="6" required>
        <input type="text" id="nickname-input" placeholder="角色暱稱" maxlength="10" required>
        <button type="submit" class="auth-btn submit">開始掛機</button>
      </form>
      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <!-- 遊戲主畫面 -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 頂部狀態列 -->
    <div id="top-bar">
      <div class="stat-group">
        <span id="player-info">冒險者 [Lv.1]</span>
        <span id="player-stats">⚔️ 攻擊力: 0 | 🩸 生命值: 0</span>
      </div>
      <div class="bar-container">
        <div class="bar exp-bar"><div id="exp-fill"></div><span>EXP</span></div>
      </div>
    </div>

    <!-- 左側面板：掛機日誌與資訊 -->
    <div id="left-panel">
      <h3>📜 掛機日誌</h3>
      <div id="log-messages"></div>
    </div>

    <!-- 右側面板：裝備欄與背包 -->
    <div id="right-panel">
      <h3>🎒 當前裝備</h3>
      <div class="gear-slot" id="weapon-slot">武器: 無</div>
      <div class="gear-slot" id="armor-slot">防具: 無</div>
      <button id="upgrade-btn" class="action-btn">強化攻擊力 (+10)</button>
      <button id="logout-btn" class="danger-btn">登出</button>
    </div>
    
    <!-- 底部功能列 -->
    <div id="bottom-bar">
      <span id="player-gold">💰 金幣: 0</span>
      <span id="current-stage">🗺️ 關卡: 第 1 層</span>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
