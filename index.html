<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字放置 RPG - 重構版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">

  <!-- 角色狀態與轉職系統 -->
  <div class="card">
    <h2>👤 角色狀態與職業</h2>
    <p>玩家：<strong id="p-name">冒險者</strong></p>
    <p>職業：<span id="p-job" class="highlight">見習冒險者</span></p>
    <p>等級：<span id="p-level">1</span> (EXP: <span id="p-exp">0</span>/<span id="p-max-exp">100</span>)</p>
    <p>戰力：⚔️ 攻擊 <span id="p-atk">10</span> | 🛡️ 防禦 <span id="p-def">2</span></p>
    <p>資產：💰 金幣 <span id="p-gold">500</span> | 🪵 木材 <span id="p-wood">0</span></p>
    <div id="job-change-container" class="job-container">
      <small class="sub-text">達到 Lv.15 可選擇職業轉職：</small><br>
      <button class="btn btn-sm" onclick="changeJob('warrior')">狂戰士</button>
      <button class="btn btn-sm" onclick="changeJob('mage')">大魔導士</button>
      <button class="btn btn-sm" onclick="changeJob('smith')">神鍛匠</button>
    </div>
  </div>

  <!-- 掛機與副本挑戰 -->
  <div class="card">
    <h2>⚔️ 冒險與無盡之塔</h2>
    <p>當前區域：<strong id="current-zone">哥布林營地</strong></p>
    <div class="btn-group">
      <button class="btn btn-sm" onclick="setZone('goblin')">哥布林營地 (Lv.1)</button>
      <button class="btn btn-sm" onclick="setZone('forest')">迷霧森林 (Lv.5)</button>
      <button class="btn btn-sm" onclick="setZone('boss')">魔王城堡 (Lv.10)</button>
    </div>
    <hr class="divider">
    <p>🏰 無盡之塔 (第 <span id="tower-floor">1</span> 層)</p>
    <button class="btn btn-success btn-sm" onclick="challengeTower()">挑戰層數 BOSS</button>
  </div>

  <!-- 背包系統 -->
  <div class="card full-width">
    <div class="card-header">
      <h2>🎒 裝備與背包</h2>
      <button class="btn btn-danger btn-sm" onclick="autoCleanInventory()">🧹 一鍵出售低階裝備</button>
    </div>
    <div id="inventory-list" class="item-list"></div>
  </div>

  <!-- 工坊合成、交易所與排行榜 -->
  <div class="card full-width">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(event, 'craft')">🔨 職人工坊 (合成)</button>
      <button class="tab-btn" onclick="switchTab(event, 'market')">⚖️ P2P 玩家交易所</button>
      <button class="tab-btn" onclick="switchTab(event, 'rank')">🏆 全服排行榜</button>
    </div>

    <!-- 工坊區 -->
    <div id="tab-craft" class="tab-content active">
      <p class="sub-text">部分進階裝備需要指定副職業（如神鍛匠）才能合成：</p>
      <div class="btn-group">
        <button class="btn btn-sm" onclick="craftItem('iron_sword')">合成 精鋼長劍 (需神鍛匠)</button>
        <button class="btn btn-sm" onclick="craftItem('wood_shield')">合成 硬木盾 (全職業)</button>
      </div>
    </div>

    <!-- 交易所區 -->
    <div id="tab-market" class="tab-content">
      <div class="btn-group">
        <button class="btn btn-sm btn-success" onclick="createMarketOrder()">+ 上架當前裝備 (500💰)</button>
      </div>
      <div id="market-list" class="item-list"></div>
    </div>

    <!-- 排行榜區 -->
    <div id="tab-rank" class="tab-content">
      <div class="card-header">
        <span>排行榜單 (異步連線與容錯保護)</span>
        <button class="btn btn-sm" onclick="loadRankings()">🔄 重整列表</button>
      </div>
      <div id="rank-list" class="item-list"></div>
    </div>
  </div>

  <!-- 冒險日誌 -->
  <div class="card full-width">
    <h2>📜 冒險日誌</h2>
    <div id="log-box"></div>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
